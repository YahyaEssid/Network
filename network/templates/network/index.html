{% extends "network/layout.html" %}
{% load static %}


{% block body %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                {% if user.is_authenticated %}
                    <form id="create_post" class="card shadow-sm mb-4">
                        {% csrf_token %}
                        <div class="card-body">
                            <h3 class="h5 card-title mb-3">New Post</h3>
                            <textarea id="post_content" class="form-control mb-3" rows="3" placeholder="What's on your mind?"></textarea>
                            <button type="submit" class="btn btn-primary">Post</button>
                        </div>
                    </form>
                {% endif %}
                <div id="Profile" class="mb-4"></div>
                <div id="all_posts"></div>
            </div>
        </div>
    </div>
{% endblock %}

{% block script %}
    <script src="{% static 'network/index.js' %}"></script>
{% endblock %}
