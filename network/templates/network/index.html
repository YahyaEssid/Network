{% extends "network/layout.html" %}
{% load static %}


{% block body %}
    {% if user.is_authenticated %}
        <form id ="create_post">
            {% csrf_token %}
            <h3>New Post</h3>
            <textarea id="post_content" placeholder="What's on your mind?"></textarea>
            <button type = "submit">POST</button>
        </form>
        <div id ="Profile">
            
        </div>
    {% endif %}
    <div id ="all_posts">
            <button class="pagination">previous</button>
            <button class="pagination">next</button>
        </div>
{% endblock %}

{% block script %}
    <script src="{% static 'network/index.js' %}"></script>
{% endblock %}
